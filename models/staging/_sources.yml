version: 2

sources:
  - name: raw
    database: ALUMINUM
    schema: RAW
    description: "Raw aluminum futures prices loaded daily from Yahoo Finance"
    tables:
      - name: raw_aluminum_prices
        description: "Daily OHLCV data for CME aluminum futures (ALI=F)"
        config:
          loaded_at_field: loaded_at
          freshness:
            warn_after: {count: 3, period: day}
            error_after: {count: 7, period: day}
        columns:
          - name: price_date
            description: "Trading date"
            data_tests:
              - not_null
              - unique
          - name: close_price
            description: "End-of-day close price in USD per troy oz"
            data_tests:
              - not_null
          - name: loaded_at
            description: "Timestamp the row was written to Snowflake"
            data_tests:
              - not_null

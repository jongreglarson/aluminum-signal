version: 2

models:
  - name: mart_aluminum_signal
    description: >
      Multi-granularity aluminum price signal table combining daily (last 14 days),
      weekly (last 13 weeks), and monthly (last 13 months) views. Each row carries
      30-day and 90-day calendar moving averages and a mean-reversion buy/hold/neutral
      signal. Intended as the single Tableau Public and Google Sheets data source.
    config:
      meta:
        elementary:
          timestamp_column: "price_date"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - granularity
              - price_date
      # business logic: BUY only fires when price is below both averages
      - dbt_utils.expression_is_true:
          arguments:
            expression: "signal != 'BUY' or (close_price < ma_30d and close_price < ma_90d)"
      # business logic: HOLD only fires when price is above both averages
      - dbt_utils.expression_is_true:
          arguments:
            expression: "signal != 'HOLD' or (close_price > ma_30d and close_price > ma_90d)"
      # sanity: all price and average values must be positive
      - dbt_utils.expression_is_true:
          arguments:
            expression: "close_price > 0 and ma_30d > 0 and ma_90d > 0"
    columns:
      - name: granularity
        description: "Row frequency: DAILY, WEEKLY, or MONTHLY"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - 'DAILY'
                  - 'WEEKLY'
                  - 'MONTHLY'
      - name: price_date
        description: "Trading date (most recent in the period for weekly/monthly rows)"
        data_tests:
          - not_null
      - name: close_price
        description: "EOD close price in USD per troy oz (CME aluminum futures)"
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 50
                max_value: 5000
                inclusive: true
          - elementary.column_anomalies:
              arguments:
                column_anomalies:
                  - null_count
                  - zero_count
      - name: ma_30d
        description: "Average close price over the preceding 30 calendar days"
        data_tests:
          - not_null
          - elementary.column_anomalies:
              arguments:
                column_anomalies:
                  - null_count
                  - average
                  - standard_deviation
      - name: ma_90d
        description: "Average close price over the preceding 90 calendar days"
        data_tests:
          - not_null
          - elementary.column_anomalies:
              arguments:
                column_anomalies:
                  - null_count
                  - average
                  - standard_deviation
      - name: signal
        description: "BUY when price < both MAs, HOLD when price > both MAs, else NEUTRAL"
        data_tests:
          - not_null
          - dbt_utils.not_constant
          - accepted_values:
              arguments:
                values:
                  - 'BUY'
                  - 'HOLD'
                  - 'NEUTRAL'
                  - 'INSUFFICIENT DATA'
      - name: days_in_90d_window
        description: "Actual trading days counted in the 90-day calendar window"
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 65
                inclusive: true

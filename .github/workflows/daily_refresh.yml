name: Daily Aluminum Price Refresh

on:
  schedule:
    - cron: '0 7 * * *'  # 7:00 AM UTC daily
  workflow_dispatch:      # allow manual trigger from GitHub UI

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r ingestion/requirements.txt

      - name: Decode Google service account key
        run: |
          echo "${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}" | tr -d ' \r\n' | base64 -d > /tmp/sa.json
          echo "sa.json size: $(wc -c < /tmp/sa.json) bytes"
          if [ ! -s /tmp/sa.json ]; then echo "ERROR: sa.json is empty — check GOOGLE_SERVICE_ACCOUNT_JSON_B64 secret" && exit 1; fi

      - name: Run pipeline
        env:
          GOOGLE_SERVICE_ACCOUNT_PATH: /tmp/sa.json
        run: python ingestion/pipeline.py

      - name: Notify on failure
        if: failure()
        run: echo "Pipeline failed — check logs above"

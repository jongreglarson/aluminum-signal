name: Keep Repo Active

# GitHub auto-disables scheduled (cron) workflows after 60 days with no
# repository pushes. This workflow commits a timestamp file monthly —
# well under that threshold — so daily_refresh.yml and publish_docs.yml
# never get silently disabled again during quiet stretches.

on:
  schedule:
    - cron: '0 12 1 * *'  # 12:00 UTC on the 1st of every month
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Touch keepalive file
        run: date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/.keepalive

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/.keepalive
          git diff --cached --quiet || git commit -m "chore: keepalive (prevent scheduled workflow auto-disable)"
          git push
